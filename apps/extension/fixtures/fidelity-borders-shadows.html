<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web2Design borders and shadows fidelity</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 20px;
    font: 16px/24px Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }
  .box {
    width: 140px;
    height: 50px;
    margin-bottom: 12px;
    background: #ffffff;
    display: inline-block;
    margin-right: 12px;
    vertical-align: top;
  }

  /* 1. Uniform solid border regression */
  #uniform-solid {
    border: 2px solid #2563eb;
  }

  /* 2. Top-only border */
  #top-only {
    border-top: 3px solid #059669;
  }

  /* 3. Bottom-only border */
  #bottom-only {
    border-bottom: 4px solid #dc2626;
  }

  /* 4. Four different widths (same color) */
  #four-widths {
    border-style: solid;
    border-color: #4b5563;
    border-width: 1px 2px 3px 4px;
  }

  /* 5. Same color + different widths */
  #same-color-diff-widths {
    border-style: solid;
    border-color: #7c3aed;
    border-top-width: 2px;
    border-right-width: 4px;
    border-bottom-width: 6px;
    border-left-width: 8px;
  }

  /* 6. Different side colors */
  #diff-colors {
    border-style: solid;
    border-top: 2px solid #ef4444;
    border-right: 3px solid #3b82f6;
    border-bottom: 4px solid #10b981;
    border-left: 5px solid #f59e0b;
  }

  /* 7. Dashed border */
  #dashed-border {
    border: 2px dashed #6366f1;
  }

  /* 8. Dotted border */
  #dotted-border {
    border: 2px dotted #8b5cf6;
  }

  /* 9. Double unsupported/approximated border */
  #double-border {
    border: 3px double #d97706;
  }

  /* 10. Rounded non-uniform border */
  #rounded-non-uniform {
    border-style: solid;
    border-color: #0284c7;
    border-width: 1px 3px 2px 4px;
    border-radius: 8px;
  }

  /* 11. Single drop-shadow regression */
  #single-shadow {
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  /* 12. Two drop shadows */
  #two-shadows {
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  }

  /* 13. Three drop shadows */
  #three-shadows {
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
  }

  /* 14. Inset shadow */
  #inset-shadow {
    box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
  }

  /* 15. Drop + inset combination */
  #drop-inset-combo {
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), inset 0 1px 2px rgba(255, 255, 255, 0.8);
  }

  /* 16. Positive spread */
  #positive-spread {
    box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.6);
  }

  /* 17. Negative spread */
  #negative-spread {
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
  }

  /* 18. Alpha shadow */
  #alpha-shadow {
    box-shadow: 0 8px 16px rgba(15, 23, 42, 0.25);
  }

  /* 19. Fractional shadow values */
  #fractional-shadow {
    box-shadow: 0.5px 1.5px 3.5px 0.5px rgba(0, 0, 0, 0.12);
  }

  /* 20. Pseudo-element non-uniform border */
  #pseudo-non-uniform {
    position: relative;
  }
  #pseudo-non-uniform::before {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 60px;
    height: 30px;
    border-top: 2px solid #047857;
    border-bottom: 4px solid #047857;
    background: #ecfdf5;
  }

  /* 21. Pseudo-element inset shadow */
  #pseudo-inset {
    position: relative;
  }
  #pseudo-inset::after {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 60px;
    height: 30px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    background: #fef2f2;
  }

  /* 22. Gradient + border + multi-shadow */
  #gradient-border-multi-shadow {
    background: linear-gradient(90deg, #3b82f6, #ec4899);
    border-top: 1px solid #1e3a8a;
    border-right: 2px solid #1e3a8a;
    border-bottom: 3px solid #1e3a8a;
    border-left: 4px solid #1e3a8a;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.4);
  }
</style>
</head>
<body>
  <div class="box" id="uniform-solid"></div>
  <div class="box" id="top-only"></div>
  <div class="box" id="bottom-only"></div>
  <div class="box" id="four-widths"></div>
  <div class="box" id="same-color-diff-widths"></div>
  <div class="box" id="diff-colors"></div>
  <div class="box" id="dashed-border"></div>
  <div class="box" id="dotted-border"></div>
  <div class="box" id="double-border"></div>
  <div class="box" id="rounded-non-uniform"></div>
  <div class="box" id="single-shadow"></div>
  <div class="box" id="two-shadows"></div>
  <div class="box" id="three-shadows"></div>
  <div class="box" id="inset-shadow"></div>
  <div class="box" id="drop-inset-combo"></div>
  <div class="box" id="positive-spread"></div>
  <div class="box" id="negative-spread"></div>
  <div class="box" id="alpha-shadow"></div>
  <div class="box" id="fractional-shadow"></div>
  <div class="box" id="pseudo-non-uniform"></div>
  <div class="box" id="pseudo-inset"></div>
  <div class="box" id="gradient-border-multi-shadow"></div>
</body>
</html>
