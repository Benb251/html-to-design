<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Web2Design fidelity limits</title>
<style>
body { font: 16px/24px Arial, sans-serif; }
.box { width: 120px; height: 40px; background: #eef; margin: 8px; }
#multiple { box-shadow: 0 4px 12px #000, 0 1px 2px #888; }
#inset { box-shadow: inset 0 4px 12px #000; }
#gradient { background-image: linear-gradient(red, blue); }
#complex-border { border: 2px solid #123456; border-left-width: 4px; }
#ellipse { border-radius: 10px / 20px; }
#transform { transform: rotate(10deg); }
#stack { position: relative; z-index: 2; }
#fixed { position: fixed; } #sticky { position: sticky; top: 0; }
#hidden { display: none; } #zero { opacity: 0; } #invisible { visibility: hidden; }
#override { visibility: visible; } #contents { display: contents; }
</style></head><body>
<div class="box" id="multiple"></div><div class="box" id="inset"></div>
<div class="box" id="gradient"></div><div class="box" id="complex-border"></div>
<div class="box" id="ellipse"></div><div class="box" id="transform">Transformed</div>
<div class="box" id="stack">Stacked</div>
<div id="fixed">Fixed omitted</div><div id="sticky">Sticky omitted</div>
<div id="hidden">Hidden omitted</div><div id="zero">Transparent omitted</div>
<div id="invisible">Invisible omitted<span id="override">Visible override</span></div>
<div id="contents"><span>Display contents</span></div><div id="pruned"><span>Plain wrapper</span></div>
</body></html>
